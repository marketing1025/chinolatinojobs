<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChinoLatino Workforce & Hospitality</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#faf8f5;color:#333;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:16px;margin:0 auto}
/* Logo */
.logo-wrap{text-align:center;margin:12px 0 4px}
.logo-wrap img{width:200px;height:auto}
/* Language toggle */
.lang-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px;padding:4px 0}
.lang-btn{background:none;border:1.5px solid #d4a843;color:#8b6914;font-size:12px;font-weight:600;padding:4px 10px;border-radius:16px;cursor:pointer;transition:all .2s}
.lang-btn.active{background:#d4a843;color:#fff}
.lang-btn:hover{background:#f5e6c4}
/* Hero */
.hero{text-align:center;padding:20px 16px 16px;margin-bottom:16px}
.hero h1{font-size:26px;font-weight:800;line-height:1.25;margin-bottom:8px}
.hero h1 .chino{color:#c0392b}
.hero h1 .latino{color:#1e8449}
.hero-sub{font-size:15px;color:#666;margin-bottom:20px;line-height:1.4}
.cta-btn{display:inline-block;background:linear-gradient(135deg,#c0392b 0%,#a93226 100%);color:#fff;font-size:17px;font-weight:700;padding:14px 40px;border-radius:30px;border:none;cursor:pointer;letter-spacing:0.3px;box-shadow:0 4px 15px rgba(192,57,43,0.3);transition:transform .15s,box-shadow .15s}
.cta-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,57,43,0.4)}
.cta-btn:active{transform:translateY(0)}
.cta-note{font-size:12px;color:#999;margin-top:10px}
/* Trust cards */
.trust-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.trust-card{background:#fff;border:1px solid #e8e0d4;border-radius:12px;padding:14px 12px;text-align:center}
.trust-card.full{grid-column:1/-1}
.trust-icon{font-size:28px;margin-bottom:6px}
.trust-title{font-size:13px;font-weight:700;color:#333;margin-bottom:3px}
.trust-desc{font-size:11px;color:#888;line-height:1.3}
/* Divider */
.section-divider{height:3px;background:linear-gradient(90deg,#c0392b,#d4a843,#1e8449);border-radius:2px;margin:8px 0 20px;opacity:0.6}
/* Scorecard */
.scorecard{display:none}
.progress-wrap{margin-bottom:20px}
.progress-label{font-size:12px;color:#888;margin-bottom:6px;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#e8e0d4;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#c0392b,#d4a843,#1e8449);border-radius:3px;transition:width .4s ease;width:0%}
/* Step card */
.step-card{background:#fff;border:1px solid #e8e0d4;border-radius:14px;padding:24px 20px;margin-bottom:16px}
.step-num{font-size:11px;color:#d4a843;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.step-q{font-size:18px;font-weight:700;color:#333;margin-bottom:4px;line-height:1.3}
.step-hint{font-size:12px;color:#888;margin-bottom:16px;line-height:1.4}
/* Inputs */
input[type=text],input[type=number],input[type=email],input[type=tel],select{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;background:#faf8f5;transition:border-color .2s;outline:none}
input:focus,select:focus{border-color:#d4a843}
textarea{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;background:#faf8f5;resize:vertical;min-height:80px;outline:none;transition:border-color .2s}
textarea:focus{border-color:#d4a843}
.field-group{margin-bottom:12px}
.field-label{font-size:12px;color:#666;font-weight:600;margin-bottom:5px;display:block}
/* Options (multiple choice) */
.option-list{display:flex;flex-direction:column;gap:8px}
.option-item{background:#faf8f5;border:1.5px solid #ddd;border-radius:10px;padding:13px 14px;cursor:pointer;font-size:14px;transition:all .15s;display:flex;align-items:center;gap:10px}
.option-item:hover{border-color:#d4a843;background:#fdf8ee}
.option-item.selected{border-color:#c0392b;background:#fdf0ee}
.option-dot{width:18px;height:18px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.option-item.selected .option-dot{border-color:#c0392b;background:#c0392b}
.option-item.selected .option-dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.option-text{flex:1}
.option-main{font-weight:600;color:#333}
.option-sub{font-size:11px;color:#888;margin-top:2px}
/* Checkbox (gender) */
.checkbox-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;cursor:pointer;margin-bottom:8px;background:#faf8f5;transition:all .15s}
.checkbox-row:hover{border-color:#d4a843}
.checkbox-row.selected{border-color:#c0392b;background:#fdf0ee}
.checkbox-box{width:20px;height:20px;border:2px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:13px;color:transparent}
.checkbox-row.selected .checkbox-box{border-color:#c0392b;background:#c0392b;color:#fff}
/* Buttons */
.nav-btns{display:flex;gap:10px;margin-top:20px}
.btn-back{flex:0 0 auto;background:none;border:1.5px solid #ddd;color:#888;font-size:14px;font-weight:600;padding:12px 18px;border-radius:10px;cursor:pointer;transition:all .15s}
.btn-back:hover{border-color:#999;color:#666}
.btn-next{flex:1;background:#1e8449;color:#fff;font-size:15px;font-weight:700;padding:13px 20px;border-radius:10px;border:none;cursor:pointer;transition:all .15s}
.btn-next:hover{background:#196f3d}
.btn-next:disabled{opacity:.35;cursor:not-allowed}
.btn-next:disabled:hover{background:#1e8449}
/* Error */
.field-error{font-size:11px;color:#c0392b;margin-top:4px;display:none}
.field-error.show{display:block}
/* Thank you */
.thankyou{display:none;text-align:center;padding:40px 20px}
.ty-check{font-size:64px;margin-bottom:16px}
.ty-title{font-size:28px;font-weight:800;margin-bottom:8px}
.ty-title .chino{color:#c0392b}
.ty-title .latino{color:#1e8449}
.ty-msg{font-size:15px;color:#666;line-height:1.5;margin-bottom:16px}
.ty-note{font-size:12px;color:#999;line-height:1.4;background:#fff;border:1px solid #e8e0d4;border-radius:10px;padding:14px;display:inline-block}
/* Footer */
.footer{text-align:center;padding:20px 0 30px;font-size:11px;color:#bbb}
.footer a{color:#d4a843;text-decoration:none}
/* Select wrapper */
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;padding-right:36px}
.select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none;font-size:14px}
/* Responsive */
@media(max-width:360px){
  .hero h1{font-size:22px}
  .trust-grid{gap:8px}
  .step-card{padding:18px 14px}
}
</style>
</head>

  <button class="lang-btn" onclick="setLang('zh')">中文</button>
</div>

let lang = 'es';
let currentStep = 0;
let ans = {pay:'',state:'',city:'',s3:'',s4:'',s5:'',s6:'',s7:'',s8:'',name:'',gender:'',age:'',phone:'',email:'',s10:'',s11:'',score:0};

// ==================== LANGUAGE ====================
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.lang-btn').forEach(b => { if(b.textContent.trim() === (l==='es'?'ES':l==='en'?'EN':'中文')) b.classList.add('active'); });
  // Reset to landing
  showPage('landing');
  currentStep = 0;
  ans = {pay:'',state:'',city:'',s3:'',s4:'',s5:'',s6:'',s7:'',s8:'',name:'',gender:'',age:'',phone:'',email:'',s10:'',s11:'',score:0};
  renderLanding();
}

function t() { return T[lang]; }

// ==================== RENDER LANDING ====================
function renderLanding() {
  const tr = t();
  document.getElementById('hero-headline').innerHTML = tr.heroH;
  document.getElementById('hero-sub').textContent = tr.heroSub;
  document.getElementById('cta-btn').textContent = tr.cta;
  document.getElementById('cta-note').textContent = tr.ctaNote;
  document.getElementById('footer-text').textContent = tr.footer;

  const grid = document.getElementById('trust-grid');
  grid.innerHTML = '';
  tr.trust.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'trust-card' + (i >= 4 ? ' full' : '');
    div.innerHTML = `<div class="trust-icon">${c.icon}</div><div class="trust-title">${c.title}</div><div class="trust-desc">${c.desc}</div>`;
    grid.appendChild(div);
  });
}

// ==================== PAGE NAVIGATION ====================
function showPage(page) {
  document.getElementById('page-landing').style.display = page==='landing'?'block':'none';
  document.getElementById('page-scorecard').style.display = page==='scorecard'?'block':'none';
  document.getElementById('page-thankyou').style.display = page==='thankyou'?'block':'none';
}

function startScorecard() {
  showPage('scorecard');
  currentStep = 0;
  renderStep();
  window.scrollTo(0, 0);
}

// ==================== RENDER STEP ====================
function renderStep() {
  const tr = t();
  const s = currentStep;
  const container = document.getElementById('step-container');

  // Progress
  const pct = Math.round(((s) / 11) * 100);
  document.getElementById('prog-step').textContent = tr.stepOf.replace('{n}', s + 1);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  // Back button
  document.getElementById('btn-back').style.display = s === 0 ? 'none' : 'block';
  // Next button text
  document.getElementById('btn-next').textContent = s === 10 ? (lang==='es'?'Enviar':lang==='en'?'Submit':'提交') : tr.next;
  document.getElementById('btn-next').disabled = true;

  const stepInfo = tr.steps[s];
  let html = `<div class="step-card"><div class="step-num">${tr.stepOf.replace('{n}', s+1)}</div><div class="step-q">${stepInfo.q}</div>`;
  if (stepInfo.hint) html += `<div class="step-hint">${stepInfo.hint}</div>`;
  else html += '<div style="height:12px"></div>';

  switch(s) {
    case 0: // Pay
      html += `<input type="text" id="inp-pay" placeholder="${stepInfo.ph}" value="${ans.pay}" oninput="validateStep()">`;
      html += `<div class="field-error" id="err-pay">${tr.errRequired}</div>`;
      break;

    case 1: // Location
      html += `<div class="field-group"><label class="field-label">${lang==='es'?'Estado':lang==='en'?'State':'州'}</label><div class="select-wrap"><select id="sel-state" onchange="onStateChange()"><option value="">${lang==='es'?'Selecciona un estado':lang==='en'?'Select a state':'选择一个州'}</option>`;
      Object.keys(statesData).sort().forEach(st => {
        html += `<option value="${st}" ${ans.state===st?'selected':''}>${st}</option>`;
      });
      html += `</select></div></div>`;
      html += `<div class="field-group"><label class="field-label">${lang==='es'?'Ciudad':lang==='en'?'City':'城市'}</label><div class="select-wrap"><select id="sel-city" onchange="onCityChange()" ${!ans.state?'disabled':''}><option value="">${lang==='es'?'Selecciona una ciudad':lang==='en'?'Select a city':'选择一个城市'}</option>`;
      if (ans.state && statesData[ans.state]) {
        statesData[ans.state].forEach(c => {
          html += `<option value="${c}" ${ans.city===c?'selected':''}>${c}</option>`;
        });
      }
      html += `</select></div></div>`;
      break;

    case 2: // Last job
      html += renderOptions(tr.s3opts, ans.s3, true);
      break;

    case 3: // How long
      html += renderSimpleOptions(tr.s4opts, ans.s4);
      break;

    case 4: // Why left
      html += renderSimpleOptions(tr.s5opts, ans.s5);
      break;

    case 5: // Relocate
      html += renderSimpleOptions(tr.s6opts, ans.s6);
      break;

    case 6: // When start
      html += renderSimpleOptions(tr.s7opts, ans.s7);
      break;

    case 7: // Good at (free text, min 10)
      html += `<textarea id="inp-s8" oninput="validateStep()" placeholder="">${ans.s8}</textarea>`;
      html += `<div class="field-error" id="err-s8">${tr.errMin.replace('{n}','10')}</div>`;
      break;

    case 8: // Contact info
      html += `
        <div class="field-group"><label class="field-label">${tr.nameLabel}</label><input type="text" id="inp-name" placeholder="${tr.namePh}" value="${ans.name}" oninput="validateStep()"></div>
        <div class="field-group"><label class="field-label">${tr.genderLabel}</label>
          <div class="checkbox-row ${ans.gender==='M'?'selected':''}" onclick="selectGender('M')"><div class="checkbox-box">${ans.gender==='M'?'✓':''}</div><span>${tr.genderM}</span></div>
          <div class="checkbox-row ${ans.gender==='F'?'selected':''}" onclick="selectGender('F')"><div class="checkbox-box">${ans.gender==='F'?'✓':''}</div><span>${tr.genderF}</span></div>
        </div>
        <div class="field-group"><label class="field-label">${tr.ageLabel}</label><input type="number" id="inp-age" placeholder="${tr.agePh}" value="${ans.age}" oninput="validateStep()" min="16" max="80"></div>
        <div class="field-group"><label class="field-label">${tr.phoneLabel}</label><input type="tel" id="inp-phone" placeholder="${tr.phonePh}" value="${ans.phone}" oninput="validateStep()"></div>
        <div class="field-group"><label class="field-label">${tr.emailLabel}</label><input type="email" id="inp-email" placeholder="${tr.emailPh}" value="${ans.email}" oninput="validateStep()"></div>
        <div class="field-error" id="err-contact">${tr.errRequired}</div>
      `;
      break;

    case 9: // Favorite movie (min 2)
      html += `<input type="text" id="inp-s10" placeholder="" value="${ans.s10}" oninput="validateStep()">`;
      html += `<div class="field-error" id="err-s10">${tr.errMin.replace('{n}','2')}</div>`;
      break;

    case 10: // Best time to call
      html += renderSimpleOptions(tr.s11opts, ans.s11);
      break;
  }

  html += '</div>';
  container.innerHTML = html;

  // Re-validate after render
  setTimeout(validateStep, 50);
  window.scrollTo(0, 0);
}

function renderOptions(opts, selected, hasSub) {
  let html = '<div class="option-list">';
  opts.forEach((o, i) => {
    const val = i.toString();
    const sel = selected === val ? ' selected' : '';
    html += `<div class="option-item${sel}" onclick="selectOption(${i})"><div class="option-dot"></div><div class="option-text"><div class="option-main">${hasSub ? o.main : o}</div>${hasSub && o.sub ? '<div class="option-sub">'+o.sub+'</div>' : ''}</div></div>`;
  });
  html += '</div>';
  return html;
}

function renderSimpleOptions(opts, selected) {
  let html = '<div class="option-list">';
  opts.forEach((o, i) => {
    const val = i.toString();
    const sel = selected === val ? ' selected' : '';
    html += `<div class="option-item${sel}" onclick="selectOption(${i})"><div class="option-dot"></div><div class="option-text"><div class="option-main">${o}</div></div></div>`;
  });
  html += '</div>';
  return html;
}

// ==================== INTERACTIONS ====================
function selectOption(idx) {
  const s = currentStep;
  const val = idx.toString();
  switch(s) {
    case 2: ans.s3 = val; break;
    case 3: ans.s4 = val; break;
    case 4: ans.s5 = val; break;
    case 5: ans.s6 = val; break;
    case 6: ans.s7 = val; break;
    case 10: ans.s11 = val; break;
  }
  // Update UI
  document.querySelectorAll('.option-item').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  validateStep();
}

function selectGender(g) {
  ans.gender = g;
  renderStep();
}

function onStateChange() {
  const sel = document.getElementById('sel-state');
  ans.state = sel.value;
  ans.city = '';
  const citySel = document.getElementById('sel-city');
  citySel.disabled = !ans.state;
  citySel.innerHTML = `<option value="">${lang==='es'?'Selecciona una ciudad':lang==='en'?'Select a city':'选择一个城市'}</option>`;
  if (ans.state && statesData[ans.state]) {
    statesData[ans.state].forEach(c => {
      citySel.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }
  validateStep();
}

function onCityChange() {
  const sel = document.getElementById('sel-city');
  ans.city = sel.value;
  validateStep();
}

// ==================== VALIDATION ====================
function validateStep() {
  const s = currentStep;
  let valid = false;

  switch(s) {
    case 0:
      const pay = document.getElementById('inp-pay');
      if (pay) { ans.pay = pay.value; valid = pay.value.trim().length > 0; }
      break;
    case 1:
      valid = ans.state !== '' && ans.city !== '';
      break;
    case 2:
      valid = ans.s3 !== '';
      break;
    case 3:
      valid = ans.s4 !== '';
      break;
    case 4:
      valid = ans.s5 !== '';
      break;
    case 5:
      valid = ans.s6 !== '';
      break;
    case 6:
      valid = ans.s7 !== '';
      break;
    case 7:
      const s8 = document.getElementById('inp-s8');
      if (s8) { ans.s8 = s8.value; valid = s8.value.trim().length >= 10; }
      break;
    case 8:
      const name = document.getElementById('inp-name');
      const age = document.getElementById('inp-age');
      const phone = document.getElementById('inp-phone');
      const email = document.getElementById('inp-email');
      if (name) ans.name = name.value;
      if (age) ans.age = age.value;
      if (phone) ans.phone = phone.value;
      if (email) ans.email = email.value;
      const ageNum = parseInt(ans.age);
      valid = ans.name.trim().length > 0 && ans.gender !== '' && !isNaN(ageNum) && ageNum >= 16 && ageNum <= 80 && ans.phone.trim().length >= 7 && /\S+@\S+\.\S+/.test(ans.email);
      break;
    case 9:
      const s10 = document.getElementById('inp-s10');
      if (s10) { ans.s10 = s10.value; valid = s10.value.trim().length >= 2; }
      break;
    case 10:
      valid = ans.s11 !== '';
      break;
  }

  document.getElementById('btn-next').disabled = !valid;
}

// ==================== SCORING ====================
function calcScore() {
  let score = 0;
  // Step 3
  const s3 = parseInt(ans.s3);
  if (s3 === 0 || s3 === 1) score += 2;
  else if (s3 === 2) score += 1;
  // Step 4
  const s4 = parseInt(ans.s4);
  if (s4 === 0) score += 3;
  else if (s4 === 1) score += 2;
  else if (s4 === 2) score += 1;
  // Step 6
  const s6 = parseInt(ans.s6);
  if (s6 === 0) score += 2;
  else if (s6 === 1) score += 1;
  // Step 7
  const s7 = parseInt(ans.s7);
  if (s7 === 0) score += 3;
  else if (s7 === 1) score += 2;
  else if (s7 === 2) score += 1;
  return score;
}

// ==================== NAVIGATION ====================
function nextStep() {
  if (document.getElementById('btn-next').disabled) return;
  if (currentStep < 10) {
    currentStep++;
    renderStep();
  } else {
    // Submit
    ans.score = calcScore();
    console.log('ChinoLatino Lead Data:', JSON.stringify(ans, null, 2));
    console.log(ans);
    showThankYou();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  } else {
    showPage('landing');
    renderLanding();
  }
}

function showThankYou() {
  const tr = t();
  showPage('thankyou');
  document.getElementById('ty-title').textContent = tr.tyTitle;
  document.getElementById('ty-msg').textContent = tr.tyMsg;
  document.getElementById('ty-note').textContent = tr.tyNote;
  document.getElementById('footer-text').textContent = tr.footer;
  window.scrollTo(0, 0);
}
